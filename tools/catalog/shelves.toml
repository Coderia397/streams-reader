# Explore shelves: hand-curated Standard Ebooks titles (CC0, U.S. public domain). Read by tools/catalog/build.py.
#
# `repo` is the GitHub repo under github.com/standardebooks. `year` is the first publication (negative = BCE);
# `year_approx = true` when only the era is known. `died` (required) is the death year of the last-surviving person whose
# work is in this edition: author, translator, illustrator or introduction writer; `died_approx = true` marks an upper
# bound. Under life + 70 a title is served worldwide from year died + 71; before that it is U.S. public domain only and
# the index marks it `region = "us"` (served to U.S. requests only). Every repo appears on exactly one shelf. Keep any
# single book under about 2.5 million characters (the catalogue budget is 150 MB on R2); re-run the build after editing.

version = 1

