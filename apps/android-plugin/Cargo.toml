[package]
name = "tauri-plugin-streams-media"
description = "Streams Reader Android layer: Media3 MediaSessionService playback, keystore-backed secrets, share intake and the in-app APK updater (Kotlin), exposed to the app's Rust core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Required by tauri-plugin's build script: `links` must equal the package name.
links = "tauri-plugin-streams-media"
build = "build.rs"

[dependencies]
tauri = "2.12.5"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
streams-native-bridge = { path = "../bridge" }

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }

# No `[lints] workspace = true`: `forbid(unsafe_code)` cannot be relaxed per item and Tauri's macros expand to
# unsafe JNI glue on Android. Clippy rules match the workspace.
[lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
