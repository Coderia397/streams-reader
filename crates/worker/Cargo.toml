[package]
name = "nolabs-worker"
description = "Cloudflare Worker for nolabs: workers-rs adapters over nolabs-server, routing, streaming R2 bodies and the embedded web app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
nolabs-core.workspace = true
nolabs-server.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
worker = { version = "0.8.7", features = ["d1", "queue"] }
worker-sys = "0.8.7"
serde-wasm-bindgen = "0.6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
web-sys = { version = "0.3", features = ["Crypto", "ReadableStream", "WritableStream", "TransformStream", "StreamPipeOptions"] }

[build-dependencies]
sha2.workspace = true
hex.workspace = true

[lints]
workspace = true
