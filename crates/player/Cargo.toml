[package]
name = "nolabs-player"
description = "Gapless audiobook player for the browser: MediaSource timeline, Media Session, sleep timer (wasm only)"
version.workspace = true
edition.workspace = true
license.workspace = true

# The timeline, buffering, seek, sleep and state logic are pure Rust and build on the host, so `cargo test -p
# nolabs-player` runs natively. Everything that touches the DOM lives in `src/web` and is compiled for wasm32 only.
[dependencies]
nolabs-core.workspace = true
thiserror.workspace = true
futures = { version = "0.3", default-features = false, features = ["std"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlAudioElement",
    "HtmlElement",
    "HtmlMediaElement",
    "Node",
    "Window",
] }

[lints]
workspace = true

# Browser test harness: a wasm page driven over the DevTools protocol by harness/run.py (see harness/README.md).
# Built as an example so it shares the workspace lockfile and target directory; on the host it compiles to nothing.
[[example]]
name = "harness"
path = "harness/src/lib.rs"
crate-type = ["cdylib"]
test = false
