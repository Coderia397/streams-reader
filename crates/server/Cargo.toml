[package]
name = "nolabs-server"
description = "Backend application logic of nolabs (auth, documents, voices, render queue, Space client) over small I/O ports"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nolabs-core.workspace = true
nolabs-mail.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
async-trait.workspace = true
hmac = "0.12"
base64 = "0.22"
url = "2.5"
# ES256 verification of Supabase access tokens; pure Rust, so the same code runs in the Worker (wasm32).
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
futures = { version = "0.3", default-features = false, features = ["executor"] }

[lints]
workspace = true
